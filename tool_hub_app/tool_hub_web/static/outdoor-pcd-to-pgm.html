<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outdoor PCD to PGM</title>
    <link rel="stylesheet" href="/hub-static/hub.css">
    <style>
      .outdoor-shell { display: grid; gap: 1rem; }
      .outdoor-panel { border: 1px solid #22303c; border-radius: 16px; background: rgba(15, 21, 29, 0.94); padding: 1rem; }
      .outdoor-grid { display: grid; grid-template-columns: repeat(4, minmax(180px, 1fr)); gap: 0.75rem; }
      .outdoor-grid label { display: grid; gap: 0.35rem; color: #8ca4b8; font-size: 0.88rem; }
      .outdoor-grid input { width: 100%; padding: 0.6rem 0.7rem; border-radius: 10px; border: 1px solid #314456; background: #121b24; color: #d6deeb; font: inherit; }
      .outdoor-actions { display: flex; flex-wrap: wrap; gap: 0.55rem; align-items: center; }
      .outdoor-layout { display: grid; grid-template-columns: minmax(760px, 1.45fr) minmax(300px, 0.55fr); gap: 1rem; align-items: start; }
      .outdoor-preview-panel { min-height: 76vh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
      .outdoor-preview-head { display: flex; align-items: center; gap: 0.55rem; }
      .outdoor-preview-head h2 { flex: 1; }
      .outdoor-preview-scale { color: #8ca4b8; font-size: 0.84rem; min-width: 3.4rem; text-align: right; }
      .outdoor-preview-frame { min-height: 68vh; max-height: 78vh; overflow: auto; background: #05080c; border-radius: 12px; border: 1px solid #22303c; display: grid; place-items: center; }
      .outdoor-preview { width: 100%; height: auto; object-fit: contain; image-rendering: pixelated; }
      .outdoor-preview[data-ready="true"] { cursor: zoom-in; }
      .outdoor-meta { color: #8ca4b8; font-size: 0.84rem; word-break: break-all; display: grid; gap: 0.35rem; }
      .preview-viewer-overlay { display: none; position: fixed; inset: 0; z-index: 12; background: rgba(5, 8, 12, 0.88); align-items: stretch; justify-content: stretch; padding: 1rem; }
      .preview-viewer-overlay.visible { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 0.75rem; }
      .preview-viewer-toolbar { display: flex; align-items: center; gap: 0.75rem; color: #d6deeb; }
      .preview-viewer-toolbar strong { flex: 1; }
      .preview-viewer-scale { color: #8ca4b8; min-width: 3.4rem; text-align: right; }
      .preview-viewer-frame { min-height: 0; overflow: auto; border: 1px solid #22303c; border-radius: 12px; background: #05080c; display: grid; place-items: center; }
      .preview-viewer-image { max-width: none; max-height: none; image-rendering: pixelated; }
      .picker-overlay { display: none; position: fixed; inset: 0; z-index: 10; background: rgba(5, 8, 12, 0.72); align-items: center; justify-content: center; }
      .picker-overlay.visible { display: flex; }
      .picker-box { width: min(820px, 92vw); max-height: 74vh; display: grid; grid-template-rows: auto 1fr; border: 1px solid #22303c; border-radius: 14px; background: #0f151d; overflow: hidden; }
      .picker-header { display: flex; align-items: center; gap: 0.75rem; padding: 0.9rem 1rem; border-bottom: 1px solid #22303c; }
      .picker-header span { flex: 1; color: #8ca4b8; font-size: 0.82rem; word-break: break-all; }
      .picker-list { overflow: auto; padding: 0.85rem; display: grid; gap: 0.45rem; }
      .picker-entry { padding: 0.65rem 0.8rem; border-radius: 10px; border: 1px solid #22303c; background: #121b24; color: #d6deeb; cursor: pointer; }
      @media (max-width: 1100px) { .outdoor-grid, .outdoor-layout { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="preview-viewer-overlay" class="preview-viewer-overlay">
      <div class="preview-viewer-toolbar">
        <strong id="preview-viewer-title">地图预览</strong>
        <span id="preview-viewer-scale" class="preview-viewer-scale">100%</span>
        <button type="button" id="preview-viewer-zoom-out">缩小</button>
        <button type="button" id="preview-viewer-zoom-in">放大</button>
        <button type="button" id="preview-viewer-reset">重置</button>
        <button type="button" id="preview-viewer-close">关闭</button>
      </div>
      <div id="preview-viewer-frame" class="preview-viewer-frame">
        <img id="preview-viewer-image" class="preview-viewer-image" alt="outdoor map preview detail">
      </div>
    </div>

    <div id="picker-overlay" class="picker-overlay">
      <div class="picker-box">
        <div class="picker-header">
          <strong id="picker-title">选择 PCD 文件</strong>
          <span id="picker-cwd"></span>
          <button type="button" id="picker-select-dir">选择当前目录</button>
          <button type="button" id="picker-close">关闭</button>
        </div>
        <div id="picker-list" class="picker-list"></div>
      </div>
    </div>

    <main class="hub-page outdoor-shell">
      <header class="hub-hero">
        <p class="hub-kicker">Outdoor Mapping · Independent PCD2PGM</p>
        <h1>Outdoor PCD to PGM</h1>
        <p class="hub-subtitle">移植独立室外 PCD2PGM：支持轨迹引导的 IDW 自适应地面高度、相对高度滤波、半径离群点滤波和 Nav2 PGM/YAML 导出。</p>
        <p><a class="tool-link" href="/">返回导航页</a></p>
      </header>

      <section class="outdoor-panel outdoor-grid">
        <label><span>地图 PCD</span><input id="pcd-path" type="text" placeholder="/abs/path/to/outdoor.pcd"></label>
        <button type="button" id="browse-pcd">浏览 PCD</button>
        <label><span>轨迹 PCD（可选）</span><input id="trajectory-path" type="text" placeholder="/abs/path/to/Trajectory-Opt.pcd"></label>
        <button type="button" id="browse-trajectory">浏览轨迹</button>
        <label><span>输出目录</span><input id="output-dir" type="text" placeholder="/abs/path/to/output"></label>
        <button type="button" id="browse-output">浏览目录</button>
        <label><span>地图名称</span><input id="map-name" type="text" value="outdoor_map"></label>
      </section>

      <section class="outdoor-panel outdoor-grid">
        <label><span>Z min</span><input id="z-min" type="number" step="0.01" value="0"></label>
        <label><span>Z max</span><input id="z-max" type="number" step="0.01" value="0.4"></label>
        <label><span>地图分辨率</span><input id="resolution" type="number" step="0.01" value="0.05"></label>
        <label><span>半径滤波范围</span><input id="radius" type="number" step="0.01" value="0.5"></label>
        <label><span>最少邻居数</span><input id="min-neighbors" type="number" step="1" value="10"></label>
        <label><span>传感器离地高度</span><input id="sensor-height" type="number" step="0.01" value="0.5"></label>
        <label><span>轨迹搜索半径</span><input id="trajectory-search-radius" type="number" step="0.1" value="30"></label>
        <div class="outdoor-actions">
          <label><input id="flag-pass-through" type="checkbox"> 反选高度范围</label>
          <button type="button" id="preview-button">生成预览</button>
          <button type="button" id="export-button">导出 PGM/YAML</button>
        </div>
      </section>

      <p id="outdoor-status" class="hub-flow" data-error="false">准备就绪</p>

      <section class="outdoor-layout">
        <article class="outdoor-panel outdoor-preview-panel">
          <div class="outdoor-preview-head">
            <h2>地图预览</h2>
            <span id="preview-scale" class="outdoor-preview-scale">100%</span>
            <button type="button" id="preview-zoom-out">缩小</button>
            <button type="button" id="preview-zoom-in">放大</button>
            <button type="button" id="preview-reset">重置</button>
          </div>
          <div class="outdoor-preview-frame">
            <img id="preview-image" class="outdoor-preview" alt="outdoor map preview">
          </div>
        </article>
        <article class="outdoor-panel outdoor-meta">
          <h2>结果信息</h2>
          <div>原始点数：<strong id="raw-point-count">-</strong></div>
          <div>滤波后点数：<strong id="filtered-point-count">-</strong></div>
          <div>地图尺寸：<strong id="map-size">-</strong></div>
          <div>地图原点：<strong id="map-origin">-</strong></div>
          <div>轨迹自适应：<strong id="trajectory-used">-</strong></div>
          <div id="warnings"></div>
          <div id="exported-files"></div>
        </article>
      </section>
    </main>
    <script type="module" src="/hub-static/outdoor-pcd-to-pgm.js?v=5"></script>
  </body>
</html>
